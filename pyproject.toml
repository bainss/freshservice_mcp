[project]
name = "freshservice-mcp-ids"
version = "1.1.1"
description = "Interim Freshservice MCP server; create_ticket accepts group_id and responder_id"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "mcp[cli]>=1.3.0,<1.9",
    "pydantic>=2.10.6,<2.14",
]

[[project.authors]]
name = "Gopi Krishnan"
email = "gopi@effy.co.in"

[[project.authors]]
name = "Maanaesh Swamy"
email = "maanaesh.s@effy.co.in"

[[project.authors]]
name = "Vijay Ragunath"
email = "vijay.r@effy.co.in"

[project.urls]
Homepage = "https://github.com/bainss/freshservice_mcp"
Repository = "https://github.com/bainss/freshservice_mcp"

[project.scripts]
freshservice-mcp = "freshservice_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshservice_mcp"]

